version: '3.8'
services:
  db:
    image: postgres:16
    container_name: rrhh_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rrhh
      POSTGRES_USER: rrhh
      POSTGRES_PASSWORD: rrhh2024
    volumes:
      - pgdata_rrhh:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI
volumes:
  pgdata_rrhh:
