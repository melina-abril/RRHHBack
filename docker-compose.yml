version: '3.8'
services:
  db:
    image: postgres:16
    container_name: rrhh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rrhh
      POSTGRES_USER: rrhh
      POSTGRES_PASSWORD: supersegura
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: rrhh_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  db_data:
