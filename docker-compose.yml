version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rrhh_db_user
      POSTGRES_PASSWORD: your-db-password
      POSTGRES_DB: rrhh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rrhh_db_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data_rrhh:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH: ""

volumes:
  db_data_rrhh:
