version: '3.9'
services:
  db:
    image: postgres:16
    restart: unless-stopped
    container_name: rrhh-pgsql
    environment:
      POSTGRES_DB: rrhh
      POSTGRES_USER: rrhh_user
      POSTGRES_PASSWORD: rrhh_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
volumes:
  postgres-data:
