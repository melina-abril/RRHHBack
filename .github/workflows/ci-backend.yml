# CI de la API (arquitectura Firebase Functions): compila functions/ con tsc en cada push a las ramas generadas.
# Reemplaza al workflow automático de la plataforma, que compila desde la raíz del repo y ahí solo está la capa
# Firestore (sin build ni tsconfig): pasaba en verde sin revisar el código de functions/.
name: CI backend

on:
  push:
    branches:
      - "ai/codegen-backend-**"
  workflow_dispatch:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm --prefix functions install --no-audit --no-fund
      - name: Compilar
        run: npm --prefix functions run build
